spring.application.name=Worktrack_backend

spring.datasource.url=${WORKTRACK_DB_URL}
spring.datasource.username=${WORKTRACK_DB_USERNAME}
spring.datasource.password=${WORKTRACK_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

jwt.secret=${WORKTRACK_JWT_SECRET}

# CORS: comma-separated list of allowed frontend origins.
# Override with environment variable WORKTRACK_CORS_ORIGINS in each environment.
cors.allowed-origins=${WORKTRACK_CORS_ORIGINS:http://localhost:5173}

# Flyway — schema migration
# baseline-on-migrate: marks the existing schema as V1 baseline on first run
# so Flyway does not try to re-run V1__initial_schema.sql on an already-populated DB.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
