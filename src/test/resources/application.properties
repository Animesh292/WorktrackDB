spring.datasource.url=jdbc:h2:mem:worktrack_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
jwt.secret=worktrack-test-signing-secret-must-be-at-least-thirty-two-bytes

# Disable Flyway in tests — H2 schema is managed by Hibernate ddl-auto=create-drop
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

# CORS test placeholder
cors.allowed-origins=http://localhost:5173
